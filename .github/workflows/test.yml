name: test

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - Justfile
  push:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - Justfile
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  should-run:
    if: "${{ github.event_name != 'push' || !contains(github.event.head_commit.message, ':bookmark: bump version') }}"
    runs-on: ubuntu-latest
    steps:
      - run: true

  test:
    runs-on: ubuntu-24.04
    needs: [should-run]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          cache: true

      - name: Run tests
        run: cargo test -q --all-features
