name: semver

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/semver.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: semver-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  semver-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          cache: true

      - uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-semver-checks

      - name: Run semver checks
        id: semver
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if cargo semver-checks check-release \
            --workspace \
            --baseline-rev "origin/${BASE_REF}" \
            2>&1 | tee /tmp/semver-output.txt; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate comment
        env:
          BREAKING: ${{ steps.semver.outputs.breaking }}
        run: |
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/semver-output.txt

          if [ "${BREAKING}" = "true" ]; then
            HEADER="⚠️ Breaking API changes detected"
          else
            HEADER="✅ No breaking API changes detected"
          fi

          {
            echo "## 📦 Semver Checks"
            echo ""
            echo "$HEADER"
            echo ""
            echo "<details>"
            echo "<summary>Details</summary>"
            echo ""
            echo '```'
            cat /tmp/semver-output.txt
            echo '```'
            echo ""
            echo "</details>"
          } | tee "$GITHUB_STEP_SUMMARY" > /tmp/semver-comment.md

      - name: Post PR comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: semver-checks
          path: /tmp/semver-comment.md
